name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Linux
          GOOS=linux GOARCH=amd64 go build -o dist/gw2cli-linux-amd64 cmd/gw2cli/main.go
          # macOS
          GOOS=darwin GOARCH=amd64 go build -o dist/gw2cli-darwin-amd64 cmd/gw2cli/main.go
          GOOS=darwin GOARCH=arm64 go build -o dist/gw2cli-darwin-arm64 cmd/gw2cli/main.go
          # Windows
          GOOS=windows GOARCH=amd64 go build -o dist/gw2cli-windows-amd64.exe cmd/gw2cli/main.go

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
